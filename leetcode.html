<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetCode Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0a192f;
            color: #ccd6f6;
            margin: 0;
            padding: 0;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .leetcode-container {
            background-color: #1a1a1a;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 1px solid #333;
            padding: 2rem;
        }
        
        .leetcode-header {
            display: flex;
            align-items: center;
            gap: 2rem;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #333;
        }
        
        .leetcode-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            background-color: #fff;
            padding: 10px;
        }
        
        .leetcode-avatar img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .leetcode-info {
            flex: 1;
        }
        
        .leetcode-info h3 {
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 0.5rem;
        }
        
        .leetcode-username {
            color: #ffa116;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }
        
        .leetcode-rank {
            display: inline-block;
            background-color: #2d2d2d;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        
        .rank-label {
            color: #999;
            margin-right: 0.3rem;
        }
        
        .rank-value {
            color: #ffa116;
            font-weight: bold;
        }
        
        .leetcode-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }
        
        .stat-card {
            background-color: #2d2d2d;
            padding: 1.5rem;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 0.5rem;
        }
        
        .stat-label {
            color: #999;
            margin-bottom: 1rem;
        }
        
        .progress-bar {
            height: 8px;
            background-color: #444;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-bar .progress {
            height: 100%;
            background-color: #ffa116;
        }
        
        .progress-bar.easy .progress {
            background-color: #00b8a3;
        }
        
        .progress-bar.medium .progress {
            background-color: #ffc01e;
        }
        
        .progress-bar.hard .progress {
            background-color: #ff375f;
        }
        
        .total-problems {
            color: #999;
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }
        
        .leetcode-badges {
            background-color: #2d2d2d;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
        }
        
        .leetcode-badges h3 {
            color: #fff;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        
        .badges-container {
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
        }
        
        .leetcode-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }
        
        .leetcode-badge img {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }
        
        .leetcode-badge span {
            color: #999;
            font-size: 0.9rem;
        }
        
        .leetcode-footer {
            text-align: center;
            margin-top: 2rem;
        }
        
        .leetcode-profile-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background-color: #ffa116;
            color: #000;
            padding: 0.8rem 1.5rem;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="leetcode-container">
            <div class="leetcode-header">
                <div class="leetcode-avatar">
                    <img src="Logos/LC.png" alt="LeetCode Logo">
                </div>
                <div class="leetcode-info">
                    <h3>Keshav Srinivas M</h3>
                    <p class="leetcode-username">@keshavsrini</p>
                    <div class="leetcode-rank">
                        <span class="rank-label">Top</span>
                        <span class="rank-value">27.94%</span>
                    </div>
                </div>
            </div>
            
            <div class="leetcode-stats">
                <div class="stat-card">
                    <div class="stat-value">271</div>
                    <div class="stat-label">Problems Solved</div>
                    <div class="progress-bar">
                        <div class="progress" style="width: 7.6%"></div>
                    </div>
                    <div class="total-problems">of 3570</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">Easy</div>
                    <div class="stat-label">148 solved</div>
                    <div class="progress-bar easy">
                        <div class="progress" style="width: 16.8%"></div>
                    </div>
                    <div class="total-problems">of 879</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">Medium</div>
                    <div class="stat-label">101 solved</div>
                    <div class="progress-bar medium">
                        <div class="progress" style="width: 5.5%"></div>
                    </div>
                    <div class="total-problems">of 1852</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">Hard</div>
                    <div class="stat-label">22 solved</div>
                    <div class="progress-bar hard">
                        <div class="progress" style="width: 2.6%"></div>
                    </div>
                    <div class="total-problems">of 839</div>
                </div>
            </div>
            
            <div class="leetcode-badges">
                <h3>Badges & Achievements</h3>
                <div class="badges-container">
                    <div class="leetcode-badge">
                        <img src="Badges/leet50.png" alt="50 Days Badge">
                        <span>50 Days</span>
                    </div>
                    <div class="leetcode-badge">
                        <img src="Badges/leet100.png" alt="100 Days Badge">
                        <span>100 Days</span>
                    </div>
                    <div class="leetcode-badge">
                        <img src="Badges/leetjan.png" alt="January Badge">
                        <span>January</span>
                    </div>
                    <div class="leetcode-badge">
                        <img src="Badges/leetmay.png" alt="May Badge">
                        <span>May</span>
                    </div>
                </div>
            </div>
            
            <div class="leetcode-footer">
                <a href="https://leetcode.com/u/keshavsrini/" target="_blank" class="leetcode-profile-link">
                    View Full Profile
                </a>
            </div>
        </div>
    </div>
</body>
</html>
