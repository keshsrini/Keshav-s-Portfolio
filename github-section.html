                    <div class="calendar"></div>

                    <div class="contribution-stat">
                        <svg class="octicon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
                            <path fill="#8b949e" d="M8 9.5a1.5 1.5 0 100-3 1.5 1.5 0 000 3z"></path>

                <div class="github-stats">
                    <a href="https://github.com/keshsrini" target="_blank" class="github-profile-link">View GitHub Profile <i class="fab fa-github"></i></a>

    </section>

    <script src="script.js"></script>
    <script src="https://unpkg.com/github-calendar@latest/dist/github-calendar.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/github-calendar@latest/dist/github-calendar-responsive.css" />
    <script>
        // GitHub contribution calendar
        GitHubCalendar(".calendar", "keshsrini", { 
            responsive: true,
            tooltips: true,
            global_stats: true,
            summary_text: ''
        }).then(summary => {
            document.getElementById('current-streak').textContent = summary.current_streak || '0';
            document.getElementById('longest-streak').textContent = summary.longest_streak || '0';
            document.getElementById('yearly-contributions').textContent = summary.total || '0';
        });
        
        // Fetch GitHub profile data in real-time
        fetch('https://api.github.com/users/keshsrini')
            .then(response => response.json())
            .then(data => {
                document.getElementById('github-avatar').innerHTML = `<img src="${data.avatar_url}" alt="GitHub Profile">`;
                document.getElementById('github-name').textContent = data.name || 'Keshav Srinivas';
                document.getElementById('github-username').textContent = '@' + data.login;
                document.getElementById('repo-count').textContent = data.public_repos;
            })
            .catch(error => console.error('Error fetching GitHub data:', error));
    </script>
